name: Puente Tuya a Windguru

# Lee la estacion Tuya (iot.tuya.com) y publica en Windguru / Weathercloud,
# sin necesidad de tener una PC encendida. Corre en los servidores de GitHub.

on:
  schedule:
    # Cada 10 minutos, pero en minutos "raros" y con dos series por hora: GitHub demora o
    # directamente saltea corridas programadas cuando hay carga (el inicio de cada hora es
    # el peor momento), asi que pedir dos series aumenta las chances de que alguna entre.
    - cron: '3,13,23,33,43,53 * * * *'
    - cron: '8,18,28,38,48,58 * * * *'
  workflow_dispatch:
    inputs:
      simular:
        description: 'Solo leer y mostrar, sin publicar'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: puente-tuya
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install --disable-pip-version-check tinytuya requests

      - name: Leer la estacion y publicar
        env:
          TUYA_REGION: us
          TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID }}
          TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
          TUYA_DEVICE_ID: ${{ secrets.TUYA_DEVICE_ID }}
          WINDGURU_UID: ${{ secrets.WINDGURU_UID }}
          WINDGURU_PASSWORD: ${{ secrets.WINDGURU_PASSWORD }}
          WEATHERCLOUD_WID: ${{ secrets.WEATHERCLOUD_WID }}
          WEATHERCLOUD_KEY: ${{ secrets.WEATHERCLOUD_KEY }}
          ESTACION: El Doradito
          HISTORIAL: data/historial.csv
          HISTORIAL_COMPLETO: data/historial_completo.csv
          ESTADO_CRUDO: data/estado_crudo.json
          BACKFILL_HORAS: '24'
          BACKFILL_MINUTOS: '30'
          BACKFILL_BLOQUE_HORAS: '2'
          BACKFILL_BLOQUES: '4'
          MAX_ANTIGUEDAD_MIN: '90'
        run: |
          if [ "${{ github.event.inputs.simular }}" = "true" ]; then
            python sync_tuya.py --simular
          else
            python sync_tuya.py
          fi

      - name: Guardar el historial en el repositorio
        run: |
          git config user.name "puente-tuya"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Sin cambios en el historial."
            exit 0
          fi
          git commit -m "historial $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Dos corridas pueden coincidir y una puede llegar con el repo atrasado
          # ("rejected ... fetch first"), o GitHub devolver un 500 momentaneo al subir.
          # Por eso: traer lo ultimo, rebasar y reintentar.
          subido=0
          for intento in 1 2 3 4; do
            if git pull --rebase --autostash origin main && git push; then
              subido=1
              break
            fi
            echo "El push fallo (intento $intento), reintento en 15 segundos..."
            sleep 15
          done
          if [ "$subido" != "1" ]; then
            echo "::error::no pude subir el historial despues de 4 intentos"
            exit 1
          fi
          echo "Historial subido."
